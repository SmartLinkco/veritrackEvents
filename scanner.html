<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Check-In Scanner</title>
    <style>
        #preview {
            width: 100%;
            max-width: 500px;
            display: block;
            margin: 0 auto;
        }
        #result {
            text-align: center;
            margin-top: 20px;
            padding: 20px;
            border-radius: 5px;
        }
        .success {
            background-color: #dff0d8;
            color: #3c763d;
        }
        .error {
            background-color: #f2dede;
            color: #a94442;
        }
        .warning {
            background-color: #fcf8e3;
            color: #8a6d3b;
        }
        .processing {
            background-color: #d9edf7;
            color: #31708f;
        }
        .spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-radius: 50%;
            border-top: 4px solid #3498db;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .scanner-frame {
            border: 2px solid #3498db;
            border-radius: 5px;
            width: 300px;
            height: 200px;
            margin: 0 auto 15px;
        }
    </style>
</head>
<body>
    <video id="preview"></video>
    <div id="result"></div>

    <script src="https://rawgit.com/schmich/instascan-builds/master/instascan.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        // Scanner elements
        const scanner = new Instascan.Scanner({ 
            video: document.getElementById('preview'),
            mirror: false,
            captureImage: false,
            backgroundScan: true
        });
        const resultDiv = document.getElementById("result");
        
        // Constants
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzFA4d-kxC9EEqoQt99V24zb84X22POQhO5E4JhPtNaPoEvTKraIrjBrpkpFPv1ug__5A/exec';
        const ALLOWED_ORIGIN = 'https://smartlinkco.github.io';

        // Initialize scanner
        initScanner();

        // Event listeners
        scanner.addListener('scan', handleScan);

        // Functions
        function initScanner() {
            Instascan.Camera.getCameras()
                .then(cameras => {
                    if (cameras.length > 0) {
                        const backCam = cameras.find(c => c.name.includes('back')) || cameras[0];
                        scanner.start(backCam);
                        showScanReady();
                    } else {
                        showCameraError('No cameras found');
                    }
                })
                .catch(err => {
                    console.error("Camera error:", err);
                    showCameraError(err.message || 'Failed to access camera');
                });
        }

        async function handleScan(content) {
            showProcessing();
            
            try {
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                        'Origin': ALLOWED_ORIGIN
                    },
                    body: `action=checkin&id=${encodeURIComponent(content)}&origin=${encodeURIComponent(ALLOWED_ORIGIN)}`,
                    credentials: 'omit'
                });
                
                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.message || `HTTP error! Status: ${response.status}`);
                }
                
                const data = await response.json();
                
                if (data.status === 'success') {
                    showCheckInSuccess(data);
                } else if (data.code === 'ALREADY_CHECKED_IN') {
                    showAlreadyCheckedIn(data);
                } else {
                    throw new Error(data.message || "Check-in failed");
                }
            } catch (error) {
                showCheckInError(error);
            }
        }

        function showScanReady() {
            resultDiv.innerHTML = `<div class="scan-ready">
                                    <div class="scanner-frame"></div>
                                    <p>Scanning for QR codes...</p>
                                  </div>`;
        }

        function showProcessing() {
            resultDiv.innerHTML = `<div class="processing">
                                    <div class="spinner"></div>
                                    <p>Verifying attendee...</p>
                                  </div>`;
        }

        function showCheckInSuccess(data) {
            resultDiv.innerHTML = `<div class="success">
                                    <h3>✅ Check-In Successful</h3>
                                    <div class="attendee-info">
                                      <p class="name">${data.name}</p>
                                      ${data.position ? `<p class="position">${data.position}</p>` : ''}
                                      ${data.company ? `<p class="company">${data.company}</p>` : ''}
                                    </div>
                                    <div class="timestamps">
                                      <p>Registered: ${data.registrationTime}</p>
                                      <p>Checked in: ${data.checkinTime}</p>
                                    </div>
                                    <div class="actions">
                                      <button onclick="printBadge()">Print Badge</button>
                                      <button onclick="initScanner()">Next Attendee</button>
                                    </div>
                                  </div>`;
        }

        function showAlreadyCheckedIn(data) {
            resultDiv.innerHTML = `<div class="warning">
                                    <h3>⚠️ Already Checked In</h3>
                                    <div class="attendee-info">
                                      <p class="name">${data.name}</p>
                                      ${data.position ? `<p class="position">${data.position}</p>` : ''}
                                      ${data.company ? `<p class="company">${data.company}</p>` : ''}
                                    </div>
                                    <div class="timestamps">
                                      <p class="previous-checkin">Previous check-in: ${data.message.split('at:')[1]}</p>
                                    </div>
                                    <div class="actions">
                                      <button onclick="initScanner()">Continue Anyway</button>
                                    </div>
                                  </div>`;
        }

        function showCheckInError(error) {
            resultDiv.innerHTML = `<div class="error">
                                    <h3>❌ ${error.message.includes('at:') ? 
                                      error.message.split('at:')[0] : 'Check-In Failed'}</h3>
                                    <p>${error.message.includes('at:') ? 
                                      `Previous check-in: ${error.message.split('at:')[1]}` : 
                                      error.message}</p>
                                    <div class="actions">
                                      <button onclick="initScanner()">Try Again</button>
                                    </div>
                                  </div>`;
        }

        function showCameraError(error) {
            const message = error.message || 'Failed to access camera';
            resultDiv.innerHTML = `<div class="error">
                                    <h3>⚠️ Camera Error</h3>
                                    <p>${message}</p>
                                    <button onclick="initScanner()">Retry</button>
                                  </div>`;
        }

        // Global functions
        window.printBadge = function() {
            // Implement badge printing logic here
            console.log("Print badge functionality would go here");
        };

        window.initScanner = initScanner;
    });
    </script>
</body>
</html>
