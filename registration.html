<form id="regForm">
    <input type="text" name="name" placeholder="Name" required>
    <input type="email" name="email" placeholder="Email" required>
    <input type="text" name="company" placeholder="Company">
    <button type="submit">Register</button>
  </form>
  
  <script>
    document.getElementById("regForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzC4fsEqpHF6IGaRsrC8bzBr1CokRTWO43hUFTgNTKgDBBwtT87BuE9kBecq-dRX_sJKw/exec";
      
      fetch(SCRIPT_URL + "?action=register", {
        method: "POST",
        body: new URLSearchParams(formData)
      })
      .then(response => response.json())
      .then(data => {
        alert("Registered! Check your email for QR code.");
      });
    });
  </script>
